[project]
# pls add other authors
authors = [{name = "Liyan Chen", email = "lchen39@stevens.edu"}]
dependencies = []
name = "ActiveSGM"
requires-python = ">=3.9"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.feature.viper.system-requirements]
cuda = "12.2"

[tool.pixi.feature.viper.dependencies]
cuda-version = "12.2.*"

[tool.pixi.dependencies]
torchvision = "*"
pytorch3d = "*"
tensorboardx = "*"
numba = "*"
mmengine = "*"
scipy = "*"
matplotlib = "*"
tqdm = "*"
pillow = "*"
trimesh = "*"
yaml = "*"
open3d = "*"
mediapy = "*"
imgviz = "*"
natsort = "*"
opencv = "*"
kornia = "*"
# For tinycudann
setuptools = "*"
pytorch-gpu = "*"
numpy = "*"
# For habitat-sim
pip = "*"

[tool.pixi.pypi-options]
no-build-isolation = ["tinycudann", "habitat-sim"]

[tool.pixi.pypi-dependencies]
tinycudann = {git = "https://github.com/NVlabs/tiny-cuda-nn/", subdirectory = "bindings/torch"}
habitat-sim = {git = "https://github.com/Huangying-Zhan/habitat-sim"}
# splatam = {git = "https://github.com/spla-tam/SplaTAM"}
attrs = ">=19.1.0"
gitpython = "*"
imageio = "*"
imageio-ffmpeg = "*"
numpy-quaternion = "*"

[tool.pixi.activation.env]
HEADLESS = "on"
BULLET = "on"

[tool.pixi.environments]
viper = ["viper"]
default = ["viper"]
