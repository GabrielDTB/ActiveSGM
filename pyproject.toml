[project]
# pls add other authors
authors = [{name = "Liyan Chen", email = "lchen39@stevens.edu"}]
dependencies = []
name = "ActiveSGM"
requires-python = ">=3.9"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "aihabitat"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.feature.viper.system-requirements]
cuda = "12.2"

[tool.pixi.feature.viper.dependencies]
cuda-version = "12.2.*"

[tool.pixi.dependencies]
torchvision = "*"
pytorch3d = "*"
tensorboardx = "*"
numba = "*"
mmengine = "*"
scipy = "*"
matplotlib = "*"
tqdm = "*"
pillow = "*"
trimesh = "*"
yaml = "*"
open3d = "*"
mediapy = "*"
imgviz = "*"
natsort = "*"
opencv = "*"
kornia = "*"
marching_cubes = "*"
plyfile = "*"
wandb = "*"
pytorch-msssim = "*"
torchmetrics = "*"
transformers = "*"
# habitat-sim does this very funkily...
habitat-sim = ">=0.3.3,<0.4"
withbullet = ">=2.0,<3"
headless = ">=2.0,<3"
# For tinycudann
setuptools = "*"
pytorch-gpu = "*"
numpy = "*"

[tool.pixi.feature.dev.dependencies]
ruff = "*"

[tool.pixi.pypi-options]
no-build-isolation = ["tinycudann", "diff_gaussian_rasterization", "torch-sparse", "torch-scatter", "channel_rasterization", "sparse_channel_rasterization"]

[tool.pixi.pypi-dependencies]
tinycudann = {git = "https://github.com/NVlabs/tiny-cuda-nn/", subdirectory = "bindings/torch"}
diff_gaussian_rasterization = {git = "https://github.com/JonathonLuiten/diff-gaussian-rasterization-w-depth"}
channel_rasterization = {path = "third_parties/channel_rasterization/channel-rasterization"}
sparse_channel_rasterization = {path = "third_parties/sparse_channel_rasterization/sparse-channel-rasterization"}
# splatam = {git = "https://github.com/spla-tam/SplaTAM"}
attrs = ">=19.1.0"
gitpython = "*"
imageio = "*"
imageio-ffmpeg = "*"
numpy-quaternion = "*"
torch-sparse = "*"
torch-scatter = "*"

[tool.pixi.activation.env]
HEADLESS = "on"
BULLET = "on"

[tool.pixi.environments]
viper = ["viper"]
default = ["viper", "dev"]
