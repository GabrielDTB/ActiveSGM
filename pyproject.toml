[project]
authors = [{name = "Gabriel Talbert Bunt", email = "gabe@dendry.net"}]
dependencies = []
name = "ActiveSGM"
requires-python = ">=3.8,<3.9"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.feature.viper.system-requirements]
cuda = "12.2"

[tool.pixi.feature.viper.dependencies]
cuda-version = "12.2.*"

[tool.pixi.dependencies]
pytorch = "1.13.1.*"
torchvision = "0.14.1.*"

[tool.pixi.pypi-dependencies]
attrs = ">=19.1.0"
gitpython = "*"
imageio = "*"
imageio-ffmpeg = "*"
matplotlib = "*"
numba = "*"
numpy = "*"
numpy-quaternion = "*"
pillow = "*"
scipy = ">=1.3.0"
tqdm = "*"
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", rev = "05cbea115acbbcbea77999c03d55155b23479991" }

[tool.uv.extra-build-dependencies]
pytorch3d = ["torch"]

[tool.pixi.dependencies.habitat-sim]
path = "../habitat-sim-hz/"

[tool.pixi.environments]
viper = ["viper"]
default = ["viper"]
