[project]
# pls add other authors
authors = [{name = "Liyan Chen", email = "lchen39@stevens.edu"}]
dependencies = []
name = "ActiveSGM"
requires-python = ">=3.9"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.feature.viper.system-requirements]
cuda = "12.2"

[tool.pixi.feature.viper.dependencies]
cuda-version = "12.2.*"

[tool.pixi.feature.dev.dependencies]
ruff = "*"

[tool.pixi.environments]
viper = ["viper"]
default = ["viper", "dev"]
